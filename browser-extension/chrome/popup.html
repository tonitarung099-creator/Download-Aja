<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Download Aja</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 440px;
      max-height: 580px;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 { font-size: 16px; margin: 0; }
    button {
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
    }
    button.primary {
      border-color: #2563eb;
      background: #2563eb;
      color: white;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }
    #list {
      padding: 10px;
      max-height: 490px;
      overflow-y: auto;
    }
    .empty {
      padding: 34px 18px;
      text-align: center;
      color: #64748b;
      line-height: 1.5;
    }
    .item {
      padding: 12px;
      margin-bottom: 8px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 11px;
    }
    .name {
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 5px 0 9px;
      color: #64748b;
      font-size: 11px;
    }
    .stream {
      color: #b45309;
      font-weight: 600;
    }
    .row {
      display: flex;
      justify-content: flex-end;
    }
    #message {
      display: none;
      padding: 9px 12px;
      margin: 10px;
      border-radius: 9px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 12px;
    }
    #youtubeCard {
      display: none;
      margin: 10px 10px 0;
      padding: 12px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 11px;
    }
    #youtubeCard .title {
      font-weight: 700;
      margin-bottom: 4px;
    }
    #youtubeCard .hint {
      color: #64748b;
      font-size: 11px;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .youtube-controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    #youtubeQuality {
      min-width: 180px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 8px;
      background: white;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <header>
    <h1>Media Terdeteksi</h1>
    <button id="clear">Bersihkan</button>
  </header>
  <div id="message"></div>
  <section id="youtubeCard">
    <div class="title">Video YouTube</div>
    <div class="hint">Download video publik/non-DRM dari halaman YouTube aktif menggunakan yt-dlp + FFmpeg.</div>
    <div class="youtube-controls">
      <select id="youtubeQuality">
        <option value="best">Terbaik tersedia</option>
        <option value="2160p">Maks. 2160p (4K)</option>
        <option value="1440p">Maks. 1440p (2K)</option>
        <option value="1080p">Maks. 1080p</option>
        <option value="720p">Maks. 720p</option>
        <option value="480p">Maks. 480p</option>
        <option value="360p">Maks. 360p</option>
      </select>
      <button id="downloadPage" class="primary">Download</button>
    </div>
  </section>
  <main id="list">
    <div class="empty">Membaca media pada tab ini…</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
