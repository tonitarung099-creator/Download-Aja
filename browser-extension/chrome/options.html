<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Download Aja - Pengaturan Browser</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #0f172a; }
    .card { border: 1px solid #e2e8f0; border-radius: 14px; padding: 22px; }
    label { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 18px; }
    label:last-child { margin-bottom: 0; }
    p { color: #64748b; line-height: 1.5; margin: 5px 0 0; }
    .text { display: block; }
    .section { margin-top: 22px; }
    textarea { width: 100%; min-height: 120px; resize: vertical; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
  </style>
</head>
<body>
  <h1>Download Aja</h1>
  <div class="card">
    <label>
      <input id="intercept" type="checkbox">
      <span class="text">
        Alihkan download Chrome otomatis ke Download Aja
        <p>Jika dimatikan, menu klik kanan “Download dengan Download Aja” tetap tersedia.</p>
      </span>
    </label>

    <label>
      <input id="detectMedia" type="checkbox">
      <span class="text">
        Deteksi media pada halaman
        <p>Menampilkan file video/audio langsung di popup extension. HLS/DASH ditandai tetapi belum diunduh sebagai file biasa.</p>
      </span>
    </label>

    <label>
      <input id="cookies" type="checkbox">
      <span class="text">
        Kirim cookie sesi saat diperlukan
        <p>Opsional untuk link yang membutuhkan login. Cookie hanya diteruskan ke aplikasi lokal untuk request download dan tidak disimpan di riwayat Download Aja.</p>
      </span>
    </label>

    <div class="section">
      <strong>Jangan intercept domain berikut</strong>
      <p>Satu domain per baris. Contoh: <code>example.com</code> atau <code>*.example.org</code>. Subdomain ikut dikecualikan.</p>
      <textarea id="excludedHosts" placeholder="example.com&#10;*.example.org"></textarea>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
