name: Build Windows Portable

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run core smoke tests
        run: dotnet run --project tests/DownloadAja.SmokeTests/DownloadAja.SmokeTests.csproj -c Release

      - name: Validate Chrome extension JavaScript
        shell: pwsh
        run: |
          node --check browser-extension/chrome/service_worker.js
          node --check browser-extension/chrome/popup.js
          node --check browser-extension/chrome/options.js

      - name: Build desktop
        run: dotnet build src/DownloadAja.Desktop/DownloadAja.Desktop.csproj -c Release

      - name: Build browser bridge
        run: dotnet build src/DownloadAja.BrowserBridge/DownloadAja.BrowserBridge.csproj -c Release

      - name: Publish desktop self-contained
        run: dotnet publish src/DownloadAja.Desktop/DownloadAja.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/Download-Aja

      - name: Publish browser bridge
        run: dotnet publish src/DownloadAja.BrowserBridge/DownloadAja.BrowserBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/Download-Aja/browser-bridge

      - name: Bundle aria2 1.37.0
        shell: pwsh
        run: |
          $url = "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "aria2.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288"
          if ($actual -ne $expected) { throw "Checksum aria2 tidak cocok: $actual" }

          $extract = Join-Path $env:RUNNER_TEMP "aria2"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ariaDir = Join-Path $extract "aria2-1.37.0-win-64bit-build1"
          New-Item -ItemType Directory -Force -Path artifacts/Download-Aja/tools/aria2 | Out-Null
          Copy-Item (Join-Path $ariaDir "aria2c.exe") artifacts/Download-Aja/tools/aria2/aria2c.exe
          Copy-Item (Join-Path $ariaDir "COPYING") artifacts/Download-Aja/tools/aria2/COPYING

      - name: Bundle FFmpeg 8.1.3 LGPL
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-21-13-55/ffmpeg-n8.1.3-win64-lgpl-8.1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "ef320b236065afe9a8dfd5f2b5aeca0fd0f0196c6dd77958b735fcbb74c10f58"
          if ($actual -ne $expected) { throw "Checksum FFmpeg tidak cocok: $actual" }

          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe tidak ditemukan dalam paket." }
          if (-not $ffprobe) { throw "ffprobe.exe tidak ditemukan dalam paket." }

          New-Item -ItemType Directory -Force -Path artifacts/Download-Aja/tools/ffmpeg | Out-Null
          Copy-Item $ffmpeg.FullName artifacts/Download-Aja/tools/ffmpeg/ffmpeg.exe
          Copy-Item $ffprobe.FullName artifacts/Download-Aja/tools/ffmpeg/ffprobe.exe

          $license = Get-ChildItem -Path $extract -Filter LICENSE.txt -Recurse | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName artifacts/Download-Aja/tools/ffmpeg/LICENSE.txt }

      - name: Bundle yt-dlp 2026.08.19
        shell: pwsh
        run: |
          $url = "https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe"
          $out = "artifacts/Download-Aja/tools/yt-dlp/yt-dlp.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $out

          $actual = (Get-FileHash -Path $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a"
          if ($actual -ne $expected) { throw "Checksum yt-dlp tidak cocok: $actual" }

          Copy-Item third-party/licenses/yt-dlp-UNLICENSE.txt artifacts/Download-Aja/tools/yt-dlp/LICENSE.txt

      - name: Bundle Deno 2.9.7
        shell: pwsh
        run: |
          $url = "https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP "deno.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238"
          if ($actual -ne $expected) { throw "Checksum Deno tidak cocok: $actual" }

          $extract = Join-Path $env:RUNNER_TEMP "deno"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $deno = Get-ChildItem -Path $extract -Filter deno.exe -Recurse | Select-Object -First 1
          if (-not $deno) { throw "deno.exe tidak ditemukan dalam paket." }

          New-Item -ItemType Directory -Force -Path artifacts/Download-Aja/tools/deno | Out-Null
          Copy-Item $deno.FullName artifacts/Download-Aja/tools/deno/deno.exe
          Copy-Item third-party/licenses/deno-MIT.txt artifacts/Download-Aja/tools/deno/LICENSE.txt

      - name: Verify bundled download engines
        shell: pwsh
        run: |
          & artifacts/Download-Aja/tools/aria2/aria2c.exe --version
          if ($LASTEXITCODE -ne 0) { throw "aria2c.exe gagal dijalankan." }

          & artifacts/Download-Aja/tools/ffmpeg/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe gagal dijalankan." }

          & artifacts/Download-Aja/tools/ffmpeg/ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe.exe gagal dijalankan." }

          & artifacts/Download-Aja/tools/yt-dlp/yt-dlp.exe --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp.exe gagal dijalankan." }

          & artifacts/Download-Aja/tools/deno/deno.exe --version
          if ($LASTEXITCODE -ne 0) { throw "deno.exe gagal dijalankan." }

          & artifacts/Download-Aja/tools/deno/deno.exe eval "console.log('Download Aja Deno OK')"
          if ($LASTEXITCODE -ne 0) { throw "Deno eval gagal dijalankan." }

          $yt = "artifacts/Download-Aja/tools/yt-dlp/yt-dlp.exe"
          $deno = (Resolve-Path "artifacts/Download-Aja/tools/deno/deno.exe").Path
          $extractors = & $yt --no-remote-components --js-runtimes "deno:$deno" --list-extractors
          if (-not ($extractors -match "youtube")) { throw "Extractor YouTube tidak ditemukan di yt-dlp." }

      - name: Smoke test aria2 local HTTP download
        shell: pwsh
        run: |
          $aria = "artifacts/Download-Aja/tools/aria2/aria2c.exe"
          $serve = Join-Path $env:RUNNER_TEMP "downloadaja-http-source"
          $out = Join-Path $env:RUNNER_TEMP "downloadaja-http-output"
          New-Item -ItemType Directory -Force -Path $serve, $out | Out-Null

          $source = Join-Path $serve "source.bin"
          $bytes = New-Object byte[] (1024 * 1024)
          for ($i = 0; $i -lt $bytes.Length; $i += 4096) {
            $bytes[$i] = [byte](($i / 4096) % 251)
          }
          [IO.File]::WriteAllBytes($source, $bytes)

          $server = Start-Process python -ArgumentList "-m","http.server","18765","--bind","127.0.0.1","--directory",$serve -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2

            & $aria --dir=$out --out=download.bin --file-allocation=none --allow-overwrite=true "http://127.0.0.1:18765/source.bin"
            if ($LASTEXITCODE -ne 0) { throw "aria2 gagal mengunduh file HTTP lokal." }

            $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash
            $downloadHash = (Get-FileHash (Join-Path $out "download.bin") -Algorithm SHA256).Hash

            if ($sourceHash -ne $downloadHash) {
              throw "Hash hasil download aria2 tidak cocok."
            }

            $duplicates = Join-Path $env:RUNNER_TEMP "downloadaja-http-duplicates"
            New-Item -ItemType Directory -Force -Path $duplicates | Out-Null

            & $aria --dir=$duplicates --auto-file-renaming=true --allow-overwrite=false --file-allocation=none "http://127.0.0.1:18765/source.bin"
            if ($LASTEXITCODE -ne 0) { throw "aria2 gagal pada download duplikat pertama." }

            & $aria --dir=$duplicates --auto-file-renaming=true --allow-overwrite=false --file-allocation=none "http://127.0.0.1:18765/source.bin"
            if ($LASTEXITCODE -ne 0) { throw "aria2 gagal melakukan auto-rename download duplikat." }

            $duplicateFiles = @(Get-ChildItem -Path $duplicates -File | Where-Object { $_.Name -notlike "*.aria2" })
            if ($duplicateFiles.Count -ne 2) {
              throw "Auto-rename aria2 tidak menghasilkan dua file terpisah. Jumlah: $($duplicateFiles.Count)"
            }

            foreach ($file in $duplicateFiles) {
              $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
              if ($hash -ne $sourceHash) {
                throw "Hash file hasil auto-rename aria2 tidak cocok: $($file.Name)"
              }
            }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Smoke test FFmpeg HLS remux
        shell: pwsh
        run: |
          $ffmpeg = "artifacts/Download-Aja/tools/ffmpeg/ffmpeg.exe"
          $smoke = Join-Path $env:RUNNER_TEMP "downloadaja-hls-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null

          & $ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=1000:sample_rate=44100" -t 2 -c:a aac -f hls -hls_time 1 -hls_list_size 0 (Join-Path $smoke "master.m3u8")
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg gagal membuat stream HLS uji." }

          & $ffmpeg -hide_banner -loglevel error -i (Join-Path $smoke "master.m3u8") -c copy -f matroska (Join-Path $smoke "result.mkv")
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg gagal membaca/remux HLS uji." }

          $result = Get-Item (Join-Path $smoke "result.mkv")
          if ($result.Length -le 0) { throw "Hasil remux HLS kosong." }

      - name: Smoke test yt-dlp local media download
        shell: pwsh
        run: |
          $yt = "artifacts/Download-Aja/tools/yt-dlp/yt-dlp.exe"
          $deno = (Resolve-Path "artifacts/Download-Aja/tools/deno/deno.exe").Path
          $ffmpegDir = (Resolve-Path "artifacts/Download-Aja/tools/ffmpeg").Path
          $serve = Join-Path $env:RUNNER_TEMP "downloadaja-ytdlp-source"
          $out = Join-Path $env:RUNNER_TEMP "downloadaja-ytdlp-output"
          New-Item -ItemType Directory -Force -Path $serve, $out | Out-Null

          $sample = Join-Path $serve "sample.mp4"
          & artifacts/Download-Aja/tools/ffmpeg/ffmpeg.exe -hide_banner -loglevel error -f lavfi -i "testsrc=size=96x54:rate=5" -t 1 -c:v mpeg4 -q:v 5 $sample
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $sample)) {
            throw "Gagal membuat media uji untuk yt-dlp."
          }

          $server = Start-Process python -ArgumentList "-m","http.server","18766","--bind","127.0.0.1","--directory",$serve -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2

            $ytOutput = @(& $yt --no-update --no-remote-components --no-playlist --windows-filenames --newline --no-colors --js-runtimes "deno:$deno" --ffmpeg-location $ffmpegDir --paths $out --output "download.%(ext)s" --print "before_dl:__DA_TITLE__%(title)s" --print "after_move:__DA_FILE__%(filepath)s" --progress "http://127.0.0.1:18766/sample.mp4" 2>&1)
            $ytExit = $LASTEXITCODE
            $ytOutput | ForEach-Object { Write-Host $_ }

            if ($ytExit -ne 0) { throw "yt-dlp gagal mengunduh media HTTP lokal." }
            if (-not ($ytOutput -match "__DA_TITLE__")) { throw "Marker judul yt-dlp tidak muncul." }
            if (-not ($ytOutput -match "__DA_FILE__")) { throw "Marker path hasil yt-dlp tidak muncul." }
            if (-not ($ytOutput -match "\[download\]")) { throw "Output progress yt-dlp tidak muncul." }

            $result = Get-ChildItem -Path $out -File | Where-Object { $_.Name -notlike "*.part" } | Select-Object -First 1
            if (-not $result -or $result.Length -le 0) {
              throw "yt-dlp tidak menghasilkan file media uji."
            }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Copy Chrome extension and tools
        shell: pwsh
        run: |
          Copy-Item browser-extension/chrome artifacts/Download-Aja/browser-extension/chrome -Recurse
          Copy-Item tools/register-chrome-integration.ps1 artifacts/Download-Aja/register-chrome-integration.ps1
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/Download-Aja/THIRD_PARTY_NOTICES.md

      - name: Write portable build metadata
        shell: pwsh
        run: |
          Set-Content -Path artifacts/Download-Aja/VERSION.txt -Value "0.5.0" -Encoding UTF8

          $ariaHash = (Get-FileHash artifacts/Download-Aja/tools/aria2/aria2c.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $ffmpegHash = (Get-FileHash artifacts/Download-Aja/tools/ffmpeg/ffmpeg.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $ytDlpHash = (Get-FileHash artifacts/Download-Aja/tools/yt-dlp/yt-dlp.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $denoHash = (Get-FileHash artifacts/Download-Aja/tools/deno/deno.exe -Algorithm SHA256).Hash.ToLowerInvariant()

          $info = @(
            "Download Aja 0.5.0",
            "Commit: $env:GITHUB_SHA",
            "Branch: $env:GITHUB_REF_NAME",
            "Workflow run: $env:GITHUB_RUN_NUMBER",
            "Build UTC: $([DateTime]::UtcNow.ToString('O'))",
            "Runtime: win-x64 self-contained",
            "aria2 SHA256: $ariaHash",
            "FFmpeg SHA256: $ffmpegHash",
            "yt-dlp SHA256: $ytDlpHash",
            "Deno SHA256: $denoHash"
          )

          Set-Content -Path artifacts/Download-Aja/BUILD_INFO.txt -Value $info -Encoding UTF8
          Copy-Item README.md artifacts/Download-Aja/README.md

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Download-Aja-Windows-x64-Portable
          path: artifacts/Download-Aja
