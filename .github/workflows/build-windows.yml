name: Build Windows Portable

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run core smoke tests
        run: dotnet run --project tests/DownloadAja.SmokeTests/DownloadAja.SmokeTests.csproj -c Release

      - name: Validate Chrome extension JavaScript
        shell: pwsh
        run: |
          node --check browser-extension/chrome/service_worker.js
          node --check browser-extension/chrome/popup.js
          node --check browser-extension/chrome/options.js

      - name: Build desktop
        run: dotnet build src/DownloadAja.Desktop/DownloadAja.Desktop.csproj -c Release

      - name: Build browser bridge
        run: dotnet build src/DownloadAja.BrowserBridge/DownloadAja.BrowserBridge.csproj -c Release

      - name: Publish desktop self-contained
        run: dotnet publish src/DownloadAja.Desktop/DownloadAja.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/Download-Aja

      - name: Publish browser bridge
        run: dotnet publish src/DownloadAja.BrowserBridge/DownloadAja.BrowserBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/Download-Aja/browser-bridge

      - name: Bundle aria2 1.37.0
        shell: pwsh
        run: |
          $url = "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "aria2.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288"
          if ($actual -ne $expected) { throw "Checksum aria2 tidak cocok: $actual" }

          $extract = Join-Path $env:RUNNER_TEMP "aria2"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ariaDir = Join-Path $extract "aria2-1.37.0-win-64bit-build1"
          New-Item -ItemType Directory -Force -Path artifacts/Download-Aja/tools/aria2 | Out-Null
          Copy-Item (Join-Path $ariaDir "aria2c.exe") artifacts/Download-Aja/tools/aria2/aria2c.exe
          Copy-Item (Join-Path $ariaDir "COPYING") artifacts/Download-Aja/tools/aria2/COPYING

      - name: Bundle FFmpeg 8.1.3 LGPL
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-21-13-55/ffmpeg-n8.1.3-win64-lgpl-8.1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "ef320b236065afe9a8dfd5f2b5aeca0fd0f0196c6dd77958b735fcbb74c10f58"
          if ($actual -ne $expected) { throw "Checksum FFmpeg tidak cocok: $actual" }

          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe tidak ditemukan dalam paket." }

          New-Item -ItemType Directory -Force -Path artifacts/Download-Aja/tools/ffmpeg | Out-Null
          Copy-Item $ffmpeg.FullName artifacts/Download-Aja/tools/ffmpeg/ffmpeg.exe

          $license = Get-ChildItem -Path $extract -Filter LICENSE.txt -Recurse | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName artifacts/Download-Aja/tools/ffmpeg/LICENSE.txt }

      - name: Verify bundled download engines
        shell: pwsh
        run: |
          & artifacts/Download-Aja/tools/aria2/aria2c.exe --version
          if ($LASTEXITCODE -ne 0) { throw "aria2c.exe gagal dijalankan." }

          & artifacts/Download-Aja/tools/ffmpeg/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe gagal dijalankan." }

      - name: Smoke test aria2 local HTTP download
        shell: pwsh
        run: |
          $aria = "artifacts/Download-Aja/tools/aria2/aria2c.exe"
          $serve = Join-Path $env:RUNNER_TEMP "downloadaja-http-source"
          $out = Join-Path $env:RUNNER_TEMP "downloadaja-http-output"
          New-Item -ItemType Directory -Force -Path $serve, $out | Out-Null

          $source = Join-Path $serve "source.bin"
          $bytes = New-Object byte[] (1024 * 1024)
          for ($i = 0; $i -lt $bytes.Length; $i += 4096) {
            $bytes[$i] = [byte](($i / 4096) % 251)
          }
          [IO.File]::WriteAllBytes($source, $bytes)

          $server = Start-Process python -ArgumentList "-m","http.server","18765","--bind","127.0.0.1","--directory",$serve -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2

            & $aria --dir=$out --out=download.bin --file-allocation=none --allow-overwrite=true "http://127.0.0.1:18765/source.bin"
            if ($LASTEXITCODE -ne 0) { throw "aria2 gagal mengunduh file HTTP lokal." }

            $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash
            $downloadHash = (Get-FileHash (Join-Path $out "download.bin") -Algorithm SHA256).Hash

            if ($sourceHash -ne $downloadHash) {
              throw "Hash hasil download aria2 tidak cocok."
            }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Smoke test FFmpeg HLS remux
        shell: pwsh
        run: |
          $ffmpeg = "artifacts/Download-Aja/tools/ffmpeg/ffmpeg.exe"
          $smoke = Join-Path $env:RUNNER_TEMP "downloadaja-hls-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null

          & $ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=1000:sample_rate=44100" -t 2 -c:a aac -f hls -hls_time 1 -hls_list_size 0 (Join-Path $smoke "master.m3u8")
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg gagal membuat stream HLS uji." }

          & $ffmpeg -hide_banner -loglevel error -i (Join-Path $smoke "master.m3u8") -c copy -f matroska (Join-Path $smoke "result.mkv")
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg gagal membaca/remux HLS uji." }

          $result = Get-Item (Join-Path $smoke "result.mkv")
          if ($result.Length -le 0) { throw "Hasil remux HLS kosong." }

      - name: Copy Chrome extension and tools
        shell: pwsh
        run: |
          Copy-Item browser-extension/chrome artifacts/Download-Aja/browser-extension/chrome -Recurse
          Copy-Item tools/register-chrome-integration.ps1 artifacts/Download-Aja/register-chrome-integration.ps1
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/Download-Aja/THIRD_PARTY_NOTICES.md

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Download-Aja-Windows-x64-Portable
          path: artifacts/Download-Aja
